{{- if not .Values.secret.existingSecret }}
{{/*
Check the shape before assembling the JSON. The service parses
RATE_LIMITS with a fallback -- a document it cannot read becomes {}, so
every scope silently goes unlimited -- and it then calls dict() on each
override map, which raises on a string. Both failure modes are invisible
at deploy time: the pod is Ready and nothing is limited, or the pod
crashes on the first /check with a dictionary-update error naming no
value.

`--set secret.limits.userModelOverrides=vip-key|gpt-4o=300` is the way
in: it assigns a string where a map belongs, and it looks plausible.
*/}}
{{- range $scope := list "userOverrides" "modelOverrides" "userModelOverrides" }}
{{- $value := index $.Values.secret.limits $scope }}
{{- if not (kindIs "map" $value) }}
{{- fail (printf "\n\nrate-limiter-tpm: secret.limits.%s must be a map, got %s (%v).\n\nUse a key per entry:\n  --set 'secret.limits.%s.gpt-4o=120'\n  --set 'secret.limits.userModelOverrides.some-key|gpt-4o=300'\nor set it in a values file, which is easier to read:\n  secret:\n    limits:\n      %s:\n        gpt-4o: 120\n\nA string here is accepted by the JSON document and then raises inside\nthe service on the first /check.\n" $scope (kindOf $value) $value $scope $scope) }}
{{- end }}
{{- end }}
{{- range $scope := list "userDefault" "modelDefault" }}
{{- $value := index $.Values.secret.limits $scope }}
{{- if not (or (kindIs "int" $value) (kindIs "int64" $value) (kindIs "float64" $value)) }}
{{- fail (printf "\n\nrate-limiter-tpm: secret.limits.%s must be a number, got %s (%v).\n\n0 means that scope is unlimited.\n" $scope (kindOf $value) $value) }}
{{- end }}
{{- end }}
{{/*
RATE_LIMITS, assembled from structured values rather than asking for a
hand-written JSON string in YAML -- which is how a misplaced brace turns
into "every scope unlimited" with no error, since the service falls back
to {} on a parse failure.

In a Secret because its user_* maps are keyed by bearer token. See
_helpers.tpl.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rate-limiter-tpm.fullname" . }}
  labels: {{- include "rate-limiter-tpm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{/*
  The authenticated counter-store URL, when there is one. The ConfigMap
  carries a credential-free VALKEY_URL and this key overrides it -- envFrom
  lists the ConfigMap first and this Secret second, so the later value wins.

  A password belongs here rather than in `config.valkeyUrl`: that renders
  into a ConfigMap, which every `get configmaps` in this namespace can
  read, and `get configmaps` is granted far more freely than `get secrets`.
  Absent, the ConfigMap's value stands -- which is correct for a Valkey
  with auth disabled.
  */}}
  {{- with .Values.secret.valkeyUrl }}
  VALKEY_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.serviceApiKey }}
  SERVICE_API_KEY: {{ . | quote }}
  {{- end }}
  RATE_LIMITS: {{ dict
    "user_default" (.Values.secret.limits.userDefault | int)
    "model_default" (.Values.secret.limits.modelDefault | int)
    "user_overrides" .Values.secret.limits.userOverrides
    "model_overrides" .Values.secret.limits.modelOverrides
    "user_model_overrides" .Values.secret.limits.userModelOverrides
    | toJson | quote }}
{{- end }}
