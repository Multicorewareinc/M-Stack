{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rate-limiter-tpm.fullname" . }}
  labels: {{- include "rate-limiter-tpm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "rate-limiter-tpm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedIngress }}
        - podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- $sm := ((.Values.metrics | default dict).serviceMonitor | default dict) }}
    {{- if $sm.enabled }}
    # Prometheus scrapes from its own namespace, which the podSelector rule
    # above (same-namespace only) would otherwise block.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sm.prometheusNamespace | default "monitoring" }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- end }}
{{- end }}
