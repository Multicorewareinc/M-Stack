{{- if and (not .Values.config.events.backboneUrl) (not .Values.config.allowNoBackbone) }}
{{- fail "rate-limiter-tpm requires config.events.backboneUrl; set config.allowNoBackbone=true only for an intentional always-allow deployment" }}
{{- end }}
{{- if ne .Values.config.queue.backend "nats" }}
{{- fail "rate-limiter-tpm currently binds a NACK-managed NATS consumer; config.queue.backend must be nats" }}
{{- end }}
{{- if and .Values.config.events.backboneUrl (ne .Values.config.events.streamName "GATEWAY_EVENTS_ENRICHED") }}
{{- fail "TPM must consume GATEWAY_EVENTS_ENRICHED; raw gateway events do not guarantee normalized token usage" }}
{{- end }}
{{- if and .Values.config.events.backboneUrl (ne .Values.config.events.streamSubject "gateway.events.enriched") }}
{{- fail "TPM must consume gateway.events.enriched; raw gateway events do not guarantee normalized token usage" }}
{{- end }}
{{- if eq .Values.config.events.durableName "rpm-counter" }}
{{- fail "TPM and RPM must use different durable consumers; use tpm-counter-enriched or another unique durable name" }}
{{- end }}
{{- if and (not .Values.config.valkeyUrl) (not .Values.secret.valkeyUrl) (not .Values.secret.existingSecret) }}
{{- fail "\n\nrate-limiter-tpm: no counter store configured, so nothing would count.\n\n/check READS per-scope counters from Valkey (ADR-013). With no VALKEY_URL\nthe service falls back to its own redis://localhost:6379/0 default, which\ninside a pod is no Valkey at all: every read errors, /check fails OPEN,\nand it allows every request -- a limiter that is deployed, healthy, and\nenforcing nothing. That is the same outcome as a missing backbone, which\nthis chart already refuses to install with.\n\nSet one of:\n  config.valkeyUrl=redis://<valkey-service>:6379/0   no password in the URL\n  secret.valkeyUrl=redis://:<pw>@<valkey-service>:6379/0   password in the URL;\n                                 rendered into this chart's Secret, which\n                                 overrides the ConfigMap value\n  secret.existingSecret=<name>   a Secret you created that carries\n                                 VALKEY_URL itself\n" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rate-limiter-tpm.fullname" . }}
  labels:
    {{- include "rate-limiter-tpm.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- /* Only when set: the guard above also accepts secret.valkeyUrl or an
  existingSecret, which carry VALKEY_URL themselves. */}}
  {{- with .Values.config.valkeyUrl }}
  VALKEY_URL: {{ . | quote }}
  {{- end }}
  ADMIN_CP_URL: {{ .Values.config.adminCpUrl | quote }}
  PLAN_CACHE_TTL: {{ .Values.config.planCacheTtl | quote }}
  QUEUE_BACKEND: {{ required "config.queue.backend is required" .Values.config.queue.backend | quote }}
  EVENT_BACKBONE_URL: {{ .Values.config.events.backboneUrl | quote }}
  EVENT_STREAM_NAME: {{ .Values.config.events.streamName | quote }}
  EVENT_STREAM_SUBJECT: {{ .Values.config.events.streamSubject | quote }}
  EVENT_DURABLE_NAME: {{ .Values.config.events.durableName | quote }}
  DEDUPE_TTL: {{ .Values.config.events.dedupeTtl | quote }}