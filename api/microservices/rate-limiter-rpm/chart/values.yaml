replicaCount: 1

# A single durable push consumer is bound by one pod. maxSurge must remain
# zero until the consumer topology supports competing replicas.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/multicorewareinc/m-stack/rate-limiter-rpm
  tag: ""
  # A sha256 digest, e.g. sha256:abc123... When set it REPLACES the tag,
  # which is the only way to guarantee every node runs the same build --
  # a re-pushed tag plus imagePullPolicy IfNotPresent otherwise leaves
  # already-cached nodes on the old image indefinitely. Pin this for any
  # deploy you would need to reproduce.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

containerPort: 8000

config:
  logLevel: INFO

  # The counter store. In this SDK that is the Valkey service:
  #   redis://<service>.<namespace>.svc:6379/0
  # If your URL carries a password, put VALKEY_URL in the Secret instead:
  # the Secret is applied after this ConfigMap and overrides it.
  #
  # Empty on purpose rather than defaulted: the service's own fallback is
  # redis://localhost:6379/0, which in a pod is no Valkey at all, and a
  # limiter that cannot reach its counters fails OPEN. An install with no
  # counter store configured anywhere is refused (see configmap.yaml)
  # rather than silently becoming an always-allow /check.
  valkeyUrl: ""
  adminCpUrl: ""
  planCacheTtl: 30

  queue:
    backend: nats

  events:
    # Set the credential-free broker URL here even when a Secret overrides
    # EVENT_BACKBONE_URL with an authenticated URL.
    backboneUrl: ""
    streamName: GATEWAY_EVENTS
    streamSubject: gateway.events
    durableName: rpm-counter
    dedupeTtl: 120

  allowNoBackbone: false

# RPM_RATE_LIMITS can contain bearer tokens as keys, so create it as a Secret
# or provide an existing Secret containing RPM_RATE_LIMITS.
secret:
  existingSecret: ""
  create: false
  serviceApiKey: ""
  valkeyUrl: ""
  eventBackboneUrl: ""
  limits:
    userDefault: 0
    modelDefault: 0
    userOverrides: {}
    modelOverrides: {}
    userModelOverrides: {}

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

metrics:
  scrapeAnnotations: true
  # A ServiceMonitor for the Prometheus Operator. Off by default because it
  # needs the operator's CRDs installed -- with them absent the object is
  # rejected at apply time, so this refuses at template time instead, with
  # a message rather than an "unknown kind" from the API server. The
  # scrapeAnnotations above are the CRD-free path and stay independent of
  # this.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, e.g. the `release: kube-prometheus-stack` many operator
    # installs select ServiceMonitors on.
    labels: {}

# Runs as the non-root uid the Dockerfiles create (10001), which is what
# lets these pods clear Pod Security Standards "restricted". runAsUser is
# repeated here rather than left to the image so the guarantee is visible
# in the manifest and survives an image rebuild that forgets its USER.
#
# Group 0 matches the Dockerfile: /app stays root-owned and group-readable,
# so nothing needs a recursive chown at build time.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Nothing here writes to its image at runtime -- verified by running each
  # image with a read-only root and no tmpfs. /tmp is mounted as an
  # emptyDir by the Deployment when this is true, so a library that spools
  # a temp file still works while the image itself stays immutable.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

nodeSelector: {}
tolerations: []
podAnnotations: {}

networkPolicy:
  enabled: false
  # matchLabels selectors allowed to reach containerPort -- e.g. the
  # model-gateway pods, the only intended caller of /check:
  #   - app.kubernetes.io/name: model-gateway
  allowedIngress: []

# A ServiceAccount of this release's own, bound to no Role. None of these
# services call the Kubernetes API, so the token is never mounted (see
# serviceaccount.yaml) -- this exists to stop the pods inheriting whatever
# the namespace's shared "default" SA has been granted.
serviceAccount:
  create: true
  # Empty => <release>-<chart>. Set a name to reuse an existing account.
  name: ""
  annotations: {}

# Off deliberately. This workload runs a single replica on purpose (see
# replicaCount above), and a PDB over one pod cannot both keep it up and
# let a node drain: minAvailable 1 would block the drain indefinitely,
# which is worse than the brief gap a drain already costs here. Enable it
# only alongside a replicaCount above 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
