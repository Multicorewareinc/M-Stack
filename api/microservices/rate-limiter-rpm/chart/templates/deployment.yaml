apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rate-limiter-rpm.fullname" . }}
  labels:
    {{- include "rate-limiter-rpm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rate-limiter-rpm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rate-limiter-rpm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.containerPort | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rate-limiter-rpm.serviceAccountName" . }}
      {{/*
      No Kubernetes API token in the pod: nothing here calls the API, so
      mounting one only hands an attacker a credential after an RCE.
      */}}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rate-limiter-rpm
          image: {{ include "rate-limiter-rpm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rate-limiter-rpm.fullname" . }}
            - secretRef:
                name: {{ include "rate-limiter-rpm.secretName" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{/*
          /ready, not /health -- the difference is the whole point
          (ADR-016). /health is liveness: uvicorn is up, and it stays
          unconditional because restarting a pod cannot clear a durable-bind
          conflict. /ready reports *counting*: with a backbone configured
          and the consumer not bound it returns 503, so a pod that answers
          /check while counting nothing leaves the Service instead of
          quietly under-enforcing.

          This also makes the maxSurge 0 note in values.yaml self-healing
          rather than merely defensive: a new pod that cannot bind the
          durable stays NotReady and stalls the rollout visibly, instead of
          going Ready with counting dead -- which is exactly the silent
          failure that values.yaml records happening on the first upgrade.
          */}}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if (.Values.securityContext | default dict).readOnlyRootFilesystem }}
          {{/*
          The only writable path the container gets. readOnlyRootFilesystem
          makes everything else immutable at runtime, which is the point --
          nothing here writes to disk in normal operation, so anything that
          suddenly does is either a library spooling a temp file or an
          attacker. An emptyDir keeps the former working and the latter
          non-persistent across a restart.
          */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if (.Values.securityContext | default dict).readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}