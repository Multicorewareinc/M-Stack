{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.fullname" . }}
  labels: {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  SERVICE_API_KEY: {{ required "secret.serviceApiKey is required when secret.create=true" .Values.secret.serviceApiKey | quote }}
  QDRANT_API_KEY: {{ required "secret.qdrantApiKey is required when secret.create=true -- without it the vector database accepts any request that reaches it" .Values.secret.qdrantApiKey | quote }}
{{- end }}
