{{/*
Only the search pods may reach the database. Anything else in the cluster
that wants reference search calls the service's API instead.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rag.qdrantName" . }}
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "rag.qdrantSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "rag.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6333
          protocol: TCP
