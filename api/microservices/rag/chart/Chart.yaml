apiVersion: v2
name: rag
description: |
  Reference search for Multistack -- finds the SDK fields, service code and
  skill notes that answer a question, by meaning and by exact words, and
  returns them ready to put in a prompt. Brings its own vector database
  (Qdrant); depends on no other Multistack component.
type: application
