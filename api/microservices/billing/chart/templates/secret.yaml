{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{/*
Local work only -- see values.yaml. Refuses to render a Secret whose
SERVICE_API_KEY is empty: the service's own .env.example ships no
default at all for this one (an unset value already fails the endpoint
closed at request time), but a Secret this chart creates with an empty
string is still worth catching here rather than discovering it as a
500 later.
*/}}
{{- if not .Values.secret.allowInsecureDefaults }}
{{- if not .Values.secret.serviceApiKey }}
{{- fail "\n\nbilling: secret.serviceApiKey is empty.\n\nadmin-control-plane's outbound calls to /internal/v1/subscriptions are\ngated on this bearer, and it must equal admin-control-plane's own\nSERVICE_API_KEY exactly.\n\nSet a real value:\n  secret.serviceApiKey=<the same value admin-control-plane uses>\nor acknowledge this is deliberate (local work only):\n  secret.allowInsecureDefaults=true\n" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing.fullname" . }}
  labels: {{- include "billing.labels" . | nindent 4 }}
  annotations:
    {{/*
    Also a hook, ordered ahead of the migration Job (weight -10 vs. the
    Job's -5): a pre-install hook Job runs before this chart's normal
    resources exist, so without this the Job's envFrom finds no Secret
    (and no DATABASE_URL to migrate with). before-hook-creation (not
    hook-succeeded) keeps it in place afterward for the Deployment to
    read.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.create=true -- the service has no database to migrate or connect to without it" .Values.secret.databaseUrl | quote }}
  SERVICE_API_KEY: {{ .Values.secret.serviceApiKey | quote }}
  {{/*
  Omitted entirely when empty, not set to "" -- both are read as
  Optional[str] by the service, and an empty string is a value, not an
  absence. Leaving these out is what actually keeps the Stripe reporter
  and the webhook endpoint inert (see values.yaml note 4).
  */}}
  {{- with .Values.secret.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
