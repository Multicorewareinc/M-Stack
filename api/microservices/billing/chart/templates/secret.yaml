{{- if and .Values.secret.create .Values.secret.existingSecret }}
{{- fail "choose either secret.existingSecret or secret.create=true, not both" }}
{{- end }}
{{- if and .Values.secret.create (not .Values.secret.allowInsecureDefaults) (not .Values.secret.serviceApiKey) }}
{{- fail "secret.serviceApiKey is required when creating the billing Secret; it must match admin-control-plane's SERVICE_API_KEY" }}
{{- end }}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing.fullname" . }}
  labels:
    {{- include "billing.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL_BILLING: {{ required "secret.databaseUrl_billing is required when secret.create=true" .Values.secret.databaseUrl_billing | quote }}
  SERVICE_API_KEY: {{ .Values.secret.serviceApiKey | quote }}
  {{- with .Values.secret.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.eventBackboneUrl }}
  EVENT_BACKBONE_URL: {{ . | quote }}
  {{- end }}
{{- end }}