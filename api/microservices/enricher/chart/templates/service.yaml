apiVersion: v1
kind: Service
metadata:
  name: {{ include "enricher.fullname" . }}
  labels: {{- include "enricher.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # By name, so a changed containerPort cannot leave the Service
      # pointing at a port nothing listens on.
      targetPort: http
      protocol: TCP
  selector: {{- include "enricher.selectorLabels" . | nindent 4 }}
