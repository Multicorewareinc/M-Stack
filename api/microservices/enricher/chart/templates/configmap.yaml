{{- if and (not .Values.config.events.backboneUrl) (not .Values.config.allowNoBackbone) }}
{{- fail "enricher requires config.events.backboneUrl; set config.allowNoBackbone=true only for an intentional inert deployment" }}
{{- end }}
{{- if ne .Values.config.queue.backend "nats" }}
{{- fail "enricher currently binds a NACK-managed NATS consumer; config.queue.backend must be nats" }}
{{- end }}
{{- if and .Values.config.tokenizer.url (lt (mul (.Values.config.events.ackWaitSeconds | int) 1000) (add (.Values.config.tokenizer.timeoutMs | int) 5000)) }}
{{- $minimumMs := add (.Values.config.tokenizer.timeoutMs | int) 5000 }}
{{- $minimumSeconds := div (add $minimumMs 999) 1000 }}
{{- fail (printf "config.events.ackWaitSeconds must be at least %d seconds (tokenizer timeout plus a 5s republish margin)" $minimumSeconds) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enricher.fullname" . }}
  labels:
    {{- include "enricher.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  QUEUE_BACKEND: {{ required "config.queue.backend is required" .Values.config.queue.backend | quote }}
  EVENT_BACKBONE_URL: {{ .Values.config.events.backboneUrl | quote }}
  EVENT_STREAM_NAME: {{ .Values.config.events.streamName | quote }}
  EVENT_STREAM_SUBJECT: {{ .Values.config.events.streamSubject | quote }}
  EVENT_DURABLE_NAME: {{ .Values.config.events.durableName | quote }}
  ENRICHED_STREAM_NAME: {{ .Values.config.events.enrichedStreamName | quote }}
  ENRICHED_SUBJECT: {{ .Values.config.events.enrichedSubject | quote }}
  MAX_DELIVER: {{ .Values.config.events.maxDeliver | quote }}
  ACK_WAIT_SECONDS: {{ .Values.config.events.ackWaitSeconds | quote }}
  TOKENIZER_URL: {{ .Values.config.tokenizer.url | quote }}
  TOKENIZER_TIMEOUT_MS: {{ .Values.config.tokenizer.timeoutMs | quote }}