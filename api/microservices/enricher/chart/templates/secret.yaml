{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enricher.fullname" . }}
  labels:
    {{- include "enricher.labels" . | nindent 4 }}
type: Opaque
stringData:
  EVENT_BACKBONE_URL: {{ required "secret.eventBackboneUrl is required when secret.create=true" .Values.secret.eventBackboneUrl | quote }}
{{- end }}