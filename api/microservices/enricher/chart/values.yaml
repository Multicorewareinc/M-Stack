replicaCount: 1

# The service binds one durable push consumer. Keep one replica and avoid
# a surge pod attempting to bind the same durable during an upgrade.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/multicorewareinc/m-stack/enricher
  tag: ""
  # A sha256 digest, e.g. sha256:abc123... When set it REPLACES the tag,
  # which is the only way to guarantee every node runs the same build --
  # a re-pushed tag plus imagePullPolicy IfNotPresent otherwise leaves
  # already-cached nodes on the old image indefinitely. Pin this for any
  # deploy you would need to reproduce.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

containerPort: 8000

config:
  logLevel: INFO

  queue:
    backend: nats

  events:
    # Empty is rejected unless allowNoBackbone explicitly opts into inactivity.
    backboneUrl: ""
    streamName: GATEWAY_EVENTS
    streamSubject: gateway.events
    durableName: enricher
    enrichedStreamName: GATEWAY_EVENTS_ENRICHED
    enrichedSubject: gateway.events.enriched

    # These values must match the externally provisioned NACK Consumer.
    maxDeliver: 5
    ackWaitSeconds: 30

  tokenizer:
    url: ""
    timeoutMs: 2000

  allowNoBackbone: false

# Optional Secret support for broker URLs containing credentials. For
# shared deployments, prefer an externally managed Secret.
secret:
  existingSecret: ""
  create: false
  eventBackboneUrl: ""

resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    memory: 192Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

metrics:
  scrapeAnnotations: true
  # A ServiceMonitor for the Prometheus Operator. Off by default because it
  # needs the operator's CRDs installed -- with them absent the object is
  # rejected at apply time, so this refuses at template time instead, with
  # a message rather than an "unknown kind" from the API server. The
  # scrapeAnnotations above are the CRD-free path and stay independent of
  # this.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, e.g. the `release: kube-prometheus-stack` many operator
    # installs select ServiceMonitors on.
    labels: {}

# Runs as the non-root uid the Dockerfiles create (10001), which is what
# lets these pods clear Pod Security Standards "restricted". runAsUser is
# repeated here rather than left to the image so the guarantee is visible
# in the manifest and survives an image rebuild that forgets its USER.
#
# Group 0 matches the Dockerfile: /app stays root-owned and group-readable,
# so nothing needs a recursive chown at build time.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Nothing here writes to its image at runtime -- verified by running each
  # image with a read-only root and no tmpfs. /tmp is mounted as an
  # emptyDir by the Deployment when this is true, so a library that spools
  # a temp file still works while the image itself stays immutable.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

nodeSelector: {}
tolerations: []
podAnnotations: {}

# A ServiceAccount of this release's own, bound to no Role. None of these
# services call the Kubernetes API, so the token is never mounted (see
# serviceaccount.yaml) -- this exists to stop the pods inheriting whatever
# the namespace's shared "default" SA has been granted.
serviceAccount:
  create: true
  # Empty => <release>-<chart>. Set a name to reuse an existing account.
  name: ""
  annotations: {}

# Off deliberately. This workload runs a single replica on purpose (see
# replicaCount above), and a PDB over one pod cannot both keep it up and
# let a node drain: minAvailable 1 would block the drain indefinitely,
# which is worse than the brief gap a drain already costs here. Enable it
# only alongside a replicaCount above 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Ingress lockdown. Disabled by default => no NetworkPolicy is installed
# and the Service stays reachable from anywhere in-cluster, matching
# today's behavior. Enabling it with an EMPTY allowedIngress denies all
# ingress to this service, so set the callers at the same time.
networkPolicy:
  enabled: false
  # matchLabels selectors allowed to reach containerPort. Its callers are:
  #   (none -- the enricher exposes only /health and /metrics; it is a
  #   NATS consumer, not an in-cluster callee. Enabling this with an
  #   empty list is the correct lockdown for it.)
  allowedIngress: []
