# admin-control-plane
#
# Three things worth knowing before you set values:
#
#   1. DATABASE_URL, ADMIN_API_KEY, SERVICE_API_KEY, VALKEY_URL and
#      JWT_SECRET are all credentials and all five live in the Secret,
#      never the ConfigMap -- DATABASE_URL and VALKEY_URL because they
#      embed a password, the three keys because they are bearer tokens
#      or signing material.
#
#   2. Migrations run once per install/upgrade via a Helm hook Job
#      (templates/migration-job.yaml), *before* the Deployment is
#      touched, using `helm.sh/hook: pre-install,pre-upgrade` -- not
#      inside every app pod. `helm upgrade` fails before any new pod is
#      scheduled if the migration fails.
#
#      The image's own docker-entrypoint.sh also runs
#      `alembic upgrade head` on every pod start. That stays as a
#      harmless no-op (Alembic skips a schema already at head) rather
#      than being removed, since dropping it is an application change,
#      not a chart one -- it also means local `docker run` still works
#      without the hook Job's help.
#
#   3. SERVICE_API_KEY and JWT_SECRET must both be the exact same values
#      configured on organization-control-plane's chart -- they are
#      shared secrets between the two services (one authenticates the
#      calls between them, the other signs the tokens each verifies),
#      not something either one generates on its own. This chart cannot
#      see the other release's values; keeping them in sync is on you.

replicaCount: 2

image:
  repository: ghcr.io/multicorewareinc/admin-control-plane
  # Empty => Chart.appVersion. Pin a digest or tag here for a real
  # deploy; `latest` gives you no way to know what is running.
  tag: ""
  pullPolicy: IfNotPresent

# GHCR packages are private by default, so a pull needs credentials.
# Named by convention rather than passed through every spec: the
# Secret is namespace-scoped and created alongside the release (see
# docs/publishing.md). Set it to [] for a public package or a
# mirror that needs no auth.
imagePullSecrets:
  - name: ghcr-creds
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# Must match the port the image's uvicorn command binds (8000).
containerPort: 8000

# --- non-secret configuration -> ConfigMap -> envFrom ------------------
config:
  logLevel: INFO
  seedPlans: true
  seedPermissions: true

  # organization-control-plane's internal API -- the org-creation
  # workflow and the user-directory proxy both call out to it.
  #   http://<org-cp-service>.<namespace>.svc:8000
  orgCpInternalUrl: http://organization-control-plane:8000
  orgTimeoutMs: 3000

  # billing's internal API -- the best-effort org/plan-change notify
  # (POST /internal/v1/subscriptions, ADR-032). Empty renders no
  # BILLING_INTERNAL_URL at all, so the service falls back to its own
  # settings.py default (http://billing:8000), which resolves nowhere on
  # a real cluster -- unlike orgCpInternalUrl above, unset is a supported
  # deployment stage (billing not deployed yet), not an error, so this
  # has no `required` guard.
  #   http://<billing-service>.<namespace>.svc.cluster.local:8000
  billingInternalUrl: ""

# --- secret configuration -----------------------------------------------
secret:
  # A Secret you created, holding DATABASE_URL, ADMIN_API_KEY,
  # SERVICE_API_KEY, VALKEY_URL and JWT_SECRET. This is the intended path
  # for anything past local work.
  #
  # This chart cannot read it, so a Secret missing one of those keys
  # installs cleanly and passes both probes. See NOTES.txt.
  existingSecret: ""

  # Local work only: create the Secret from the values below. They then
  # sit in your values file and in `helm get values`, readable by anyone
  # with release access.
  create: false

  # postgresql+asyncpg://<user>:<pass>@<host>:5432/admin_control_plane
  databaseUrl: ""
  adminApiKey: ""
  serviceApiKey: ""

  # The cache holding the brute-force lockout counters. settings.py
  # defaults valkey_url to redis://localhost:6379/0, which in a pod is no
  # Redis at all -- and lockout.check_locked runs before the password is
  # even verified, so a missing one is not a degraded login, it is a 500
  # on every attempt. In this SDK that is the Valkey capability:
  #
  #   redis://:<password>@valkey-primary.<namespace>.svc.cluster.local:6379/1
  #
  # A Secret value rather than a ConfigMap one because it carries the
  # password; the limiter charts take theirs from a ConfigMap and say to
  # move it here when it does.
  valkeyUrl: ""

  # HS256 signing key for access and refresh tokens. jwt_secret has no
  # default on purpose -- jwt.py raises JwtSecretUnsetError and fails
  # login closed rather than ever issuing an unsigned token -- so an
  # unset one presents exactly like the missing cache above: healthy
  # pods, passing probes, 500 on every sign-in.
  #
  # Must be the SAME value on both control planes: each verifies tokens
  # the other issued.
  jwtSecret: ""

  # The service's own .env.example ships "change-me" as the default for
  # both keys, so a forgotten override still boots -- wide open, not
  # broken. This chart refuses to install a Secret it creates itself
  # (secret.create=true) with either key left at "change-me" unless you
  # set this true. It never inspects an existingSecret's contents.
  allowInsecureDefaults: false

# The pre-install/pre-upgrade migration Job.
migration:
  # Bounds how long `helm install`/`helm upgrade` waits for the Job
  # before giving up and failing the release.
  activeDeadlineSeconds: 120
  backoffLimit: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 384Mi

# /health serves both probes -- it does not touch Postgres, so
# readiness cannot flap on transient DB trouble.
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

metrics:
  scrapeAnnotations: true

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # runAsNonRoot/runAsUser are deliberately unset: the image builds on
  # python:3.12-slim with no non-root user created, so enabling them
  # without first rebuilding the image gives a pod that cannot start.

# Keeps pods off the control plane, which nothing else enforces.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

nodeSelector: {}
tolerations: []
podAnnotations: {}
