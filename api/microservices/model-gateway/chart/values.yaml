replicaCount: 2

image:
  repository: ghcr.io/multicorewareinc/m-stack/model-gateway
  tag: ""
  # A sha256 digest, e.g. sha256:abc123... When set it REPLACES the tag,
  # which is the only way to guarantee every node runs the same build --
  # a re-pushed tag plus imagePullPolicy IfNotPresent otherwise leaves
  # already-cached nodes on the old image indefinitely. Pin this for any
  # deploy you would need to reproduce.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

config:
  logLevel: INFO
  valkeyUrl: redis://localhost:6379/0

  # The OpenAI-compatible upstream. In this SDK that is the vLLM service:
  #   http://<vllm-service>.<namespace>.svc:8000
  #
  # Empty on purpose rather than defaulted: this container listens on 8080,
  # so a localhost default would point every proxied request at a dead port
  # inside the gateway's own pod -- probes pass, the pod goes Ready, and
  # each /v1 call fails at the proxy hop. The `required` in configmap.yaml
  # only bites when there is nothing here to fall back to.
  upstreamUrl: ""

  # Where /v1 auth verifies a bearer against the org that owns it
  # (GET /internal/v1/api-keys/verify). Not optional: the static
  # single-key auth mode was removed (ADR-026), so with no organization
  # control plane to call, EVERY /v1 request fails closed with a 503 --
  # deployed, healthy, and unable to serve a single authenticated
  # request. In this SDK that is the organization control plane:
  #   http://organization-control-plane.<namespace>.svc.cluster.local:8000
  orgCpInternalUrl: ""
  apiKeyCacheTtlSeconds: 300
  requestTimeout: 60
  modelRoutes: "{}"

  policy:
    endpoints: []
    timeoutMs: 500
    failMode: closed

  queue:
    backend: nats

  events:
    backboneUrl: ""
    streamName: GATEWAY_EVENTS
    streamSubject: gateway.events
    captureBodies: false
    maxInflight: 1000

secret:
  existingSecret: ""
  create: false
  orgVerifyApiKey: ""
  upstreamApiKey: ""
  # Leave empty to use config.modelRoutes. Set only when routes contain credentials.
  modelRoutes: ""
  # Optional credential-bearing URLs override their ConfigMap counterparts.
  valkeyUrl: ""
  eventBackboneUrl: ""

# Must exceed config.requestTimeout (60) plus preStopSleepSeconds, or a
# rollout SIGKILLs calls that were still inside their allowed window.
terminationGracePeriodSeconds: 75

# Seconds to wait between "pod is Terminating" and SIGTERM, so endpoint
# removal has propagated before the server stops accepting. 0 disables the
# hook entirely.
preStopSleepSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

metrics:
  scrapeAnnotations: true
  # A ServiceMonitor for the Prometheus Operator. Off by default because it
  # needs the operator's CRDs installed -- with them absent the object is
  # rejected at apply time, so this refuses at template time instead, with
  # a message rather than an "unknown kind" from the API server. The
  # scrapeAnnotations above are the CRD-free path and stay independent of
  # this.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, e.g. the `release: kube-prometheus-stack` many operator
    # installs select ServiceMonitors on.
    labels: {}

# Runs as the non-root uid the Dockerfiles create (10001), which is what
# lets these pods clear Pod Security Standards "restricted". runAsUser is
# repeated here rather than left to the image so the guarantee is visible
# in the manifest and survives an image rebuild that forgets its USER.
#
# Group 0 matches the Dockerfile: /app stays root-owned and group-readable,
# so nothing needs a recursive chown at build time.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Nothing here writes to its image at runtime -- verified by running each
  # image with a read-only root and no tmpfs. /tmp is mounted as an
  # emptyDir by the Deployment when this is true, so a library that spools
  # a temp file still works while the image itself stays immutable.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Keeps pods off the control plane, which nothing else enforces --
# rke2-cp01 carries no taint. Override wholesale if you need to pin.
# podAntiAffinity is preferred, not required: on a single-node cluster a
# required rule would leave the second replica Pending forever, and a chart
# that only works on a multi-node cluster is worse than one that degrades
# to co-located pods. Where there is more than one eligible node the
# scheduler honours it -- which is what stops replicaCount 2 from being two
# pods on one node, i.e. no redundancy against the very failure a second
# replica exists for.
#
# The selector matches on chart name alone: values.yaml cannot see
# .Release.Name, and repelling other releases of the same chart is the
# behaviour you want here anyway.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: model-gateway
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

nodeSelector: {}
tolerations: []
podAnnotations: {}

networkPolicy:
  enabled: false
  # matchLabels selectors allowed to reach containerPort -- e.g. the Istio
  # ingress gateway's own pods:
  #   - istio: ingressgateway
  allowedIngress: []

# A ServiceAccount of this release's own, bound to no Role. None of these
# services call the Kubernetes API, so the token is never mounted (see
# serviceaccount.yaml) -- this exists to stop the pods inheriting whatever
# the namespace's shared "default" SA has been granted.
serviceAccount:
  create: true
  # Empty => <release>-<chart>. Set a name to reuse an existing account.
  name: ""
  annotations: {}

# A voluntary-disruption floor, so a node drain or cluster upgrade cannot
# take every replica at once. minAvailable 1 with replicaCount 2 lets one
# pod move at a time.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
