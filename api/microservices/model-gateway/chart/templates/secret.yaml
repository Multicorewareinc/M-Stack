{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-gateway.fullname" . }}
  labels:
    {{- include "model-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  ORG_VERIFY_API_KEY: {{ required "secret.orgVerifyApiKey is required when secret.create=true" .Values.secret.orgVerifyApiKey | quote }}
  {{- with .Values.secret.upstreamApiKey }}
  UPSTREAM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.modelRoutes }}
  MODEL_ROUTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.valkeyUrl }}
  VALKEY_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.eventBackboneUrl }}
  EVENT_BACKBONE_URL: {{ . | quote }}
  {{- end }}
{{- end }}