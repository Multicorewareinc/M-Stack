{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{/*
Local work only -- see values.yaml. UPSTREAM_API_KEY is omitted entirely
when empty rather than set to "": the service treats it as
Optional[str], and an empty string is a value, not an absence.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-gateway.fullname" . }}
  labels: {{- include "model-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ required "secret.apiKey is required when secret.create=true" .Values.secret.apiKey | quote }}
  ORG_VERIFY_API_KEY: {{ required "secret.orgVerifyApiKey is required when secret.create=true -- verify_api_key's call to the organization control plane fails closed with a 503 without it, and the value must equal that release's secret.mgServiceApiKey exactly" .Values.secret.orgVerifyApiKey | quote }}
  MODEL_ROUTES: {{ .Values.secret.modelRoutes | default "{}" | quote }}
  {{- with .Values.secret.upstreamApiKey }}
  UPSTREAM_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
