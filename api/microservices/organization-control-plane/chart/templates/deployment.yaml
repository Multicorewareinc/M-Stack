apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "organization-control-plane.fullname" . }}
  labels: {{- include "organization-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "organization-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "organization-control-plane.selectorLabels" . | nindent 8 }}
      annotations:
        {{/*
        Roll the pods when config changes. Without this, editing a value
        rewrites the ConfigMap/Secret and the running pods keep the old
        env until something unrelated restarts them -- which reads as
        "the setting did not work".
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.containerPort | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "organization-control-plane.serviceAccountName" . }}
      {{/*
      No Kubernetes API token in the pod: nothing here calls the API, so
      mounting one only hands an attacker a credential after an RCE.
      */}}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: organization-control-plane
          image: {{ include "organization-control-plane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "organization-control-plane.fullname" . }}
            - secretRef:
                name: {{ include "organization-control-plane.secretName" . }}
          {{- if ((.Values.probes | default dict).startup | default dict).enabled }}
          {{/*
          The image's entrypoint runs `alembic upgrade head` before uvicorn
          binds, so /health does not answer until migrations finish. Without
          a startupProbe the liveness probe owns that window -- roughly 35s
          at the defaults below it -- and a migration slower than that (a
          cold database, a large table, a first install) gets the container
          SIGKILLed and restarted, which re-runs the migration and loops.
          A startupProbe suspends liveness until it first succeeds, so slow
          startup and "wedged after startup" stop being the same signal.
          */}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: {{ ((.Values.probes | default dict).startup | default dict).periodSeconds | default 5 }}
            failureThreshold: {{ ((.Values.probes | default dict).startup | default dict).failureThreshold | default 30 }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if (.Values.securityContext | default dict).readOnlyRootFilesystem }}
          {{/*
          The only writable path the container gets. readOnlyRootFilesystem
          makes everything else immutable at runtime, which is the point --
          nothing here writes to disk in normal operation, so anything that
          suddenly does is either a library spooling a temp file or an
          attacker. An emptyDir keeps the former working and the latter
          non-persistent across a restart.
          */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if (.Values.securityContext | default dict).readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
