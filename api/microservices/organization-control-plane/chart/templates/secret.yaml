{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{/*
Local work only -- see values.yaml. Refuses to render a Secret that
still carries the service's own insecure default ("change-me") for
SERVICE_API_KEY, unless that is explicitly acknowledged: a Secret this
chart creates with the placeholder in it is indistinguishable at
deploy time from one that was actually configured.
*/}}
{{- if not .Values.secret.allowInsecureDefaults }}
{{- if or (eq .Values.secret.serviceApiKey "change-me") (eq .Values.secret.serviceApiKey "") }}
{{- fail "\n\norganization-control-plane: secret.serviceApiKey is empty or\n\"change-me\".\n\nThat is the service's own insecure default (.env.example). This value\nis also shared with admin-control-plane -- both charts must be given\nthe identical value.\n\nSet a real value:\n  secret.serviceApiKey=<a generated token>\nor acknowledge this is deliberate (local work only):\n  secret.allowInsecureDefaults=true\n" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "organization-control-plane.fullname" . }}
  labels: {{- include "organization-control-plane.labels" . | nindent 4 }}
  annotations:
    {{/*
    Also a hook, ordered ahead of the migration Job (weight -10 vs. the
    Job's -5): a pre-install hook Job runs before this chart's normal
    resources exist, so without this the Job's envFrom finds no Secret
    (and no DATABASE_URL to migrate with). before-hook-creation (not
    hook-succeeded) keeps it in place afterward for the Deployment to
    read.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.create=true -- the service has no database to migrate or connect to without it" .Values.secret.databaseUrl | quote }}
  VALKEY_URL: {{ required "secret.valkeyUrl is required when secret.create=true -- the login path checks the lockout counters before verifying a password, so with no cache every sign-in is a 500" .Values.secret.valkeyUrl | quote }}
  JWT_SECRET: {{ required "secret.jwtSecret is required when secret.create=true -- jwt.py fails login closed rather than issue an unsigned token, and the value must match the peer control plane" .Values.secret.jwtSecret | quote }}
  SERVICE_API_KEY: {{ .Values.secret.serviceApiKey | quote }}
  MG_SERVICE_API_KEY: {{ required "secret.mgServiceApiKey is required when secret.create=true -- require_mg_service_key raises a 500 on every model-gateway verify call without it, and the value must match model-gateway's secret.orgVerifyApiKey exactly" .Values.secret.mgServiceApiKey | quote }}
{{- end }}
