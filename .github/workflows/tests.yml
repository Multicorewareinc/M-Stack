name: Repository Tests

on:
  push:
    branches: [main, staging]
    paths:
      - "tests/**"
      - "multistack/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "tests/**"
      - "multistack/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: repository-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-all:
    name: Full repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install test dependencies
        run: make install-tests

      - name: Run all tests
        run: >-
          make test-all-ci
          TEST_ALL_ARGS="--cov=multistack --cov-report=term-missing
          --cov-report=xml:test-results/coverage.xml
          --junitxml=test-results/junit.xml"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-test-results
          path: test-results/
          if-no-files-found: warn
