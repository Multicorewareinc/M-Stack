name: Helm Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: helm-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install test dependencies
        run: make install-tests

      - name: Run Helm tests
        run: make test-helm TEST_ALL_ARGS="--junitxml=test-results/helm-junit.xml"

      - name: Upload Helm test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-test-results
          path: test-results/
          if-no-files-found: warn
