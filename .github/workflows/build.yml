name: Build All Microservices

on:
  workflow_dispatch:
    inputs:
      push_to_ghcr:
        description: 'Push images to GHCR?'
        required: true
        default: true
        type: boolean

concurrency:
  group: build-all-microservices
  cancel-in-progress: false

jobs:
  build:
    name: Build all microservices
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: inputs.push_to_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Make
        run: |
          SHA=$(git rev-parse --verify HEAD | cut -c1-7)
          make docker-build TAG="${SHA}"

      - name: Build latest images with Make
        run: make docker-build TAG=latest

      - name: Push images with Make
        if: inputs.push_to_ghcr
        run: |
          SHA=$(git rev-parse --verify HEAD | cut -c1-7)
          make docker-push TAG="${SHA}"
          make docker-push TAG=latest

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Matrix Result:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY