        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "- Image: \`ghcr.io/${{ github.repository }}/${{ matrix.service }}:${IMAGE_TAG}\`"
            echo "- Chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/${{ matrix.service }}:${CHART_VERSION}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "## Deploy Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| SHA | \`${{ needs.resolve.outputs.sha }}\` |"
            echo "| Chart version | \`${{ needs.resolve.outputs.chart_version }}\` |"
            echo "| Matrix result | \`${{ needs.deploy.result }}\` |"
