<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Agentic layer architecture and request flow</title>
  <desc id="desc">A user message flows through Knowledge, then Orchestration (LangGraph), which calls the MCP Tool layer and loops back until it produces a final text reply, optionally with a generated script, or exhausts its turn budget. No execute or deploy tool exists anywhere in this layer -- nothing here can reach real infrastructure.</desc>

  <rect x="0" y="0" width="1160" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ===== Edges (drawn first, so nodes sit on top of line ends) ===== -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none">
    <!-- user -> knowledge -->
    <line x1="186" y1="70" x2="248" y2="70" marker-end="url(#arrow)"/>
    <!-- knowledge -> call_model -->
    <path d="M440,70 C480,70 490,82 523,82" marker-end="url(#arrow)"/>
    <!-- call_model -> execute_tools -->
    <line x1="660" y1="110" x2="660" y2="128" marker-end="url(#arrow)"/>
    <!-- execute_tools -> tool layer -->
    <path d="M797,148 C850,140 860,120 888,100" marker-end="url(#arrow)"/>
    <!-- tool layer -> call_model (result) -->
    <path d="M1005,68 C1040,40 820,40 797,78" marker-end="url(#arrow)"/>
    <!-- execute_tools -> call_model (loop / retry) -->
    <path d="M523,158 C460,158 460,82 523,82" marker-end="url(#arrow)"/>
    <!-- execute_tools -> reply -->
    <path d="M555,186 C420,230 260,255 175,272" marker-end="url(#arrow)"/>
    <!-- execute_tools -> fallback -->
    <path d="M650,186 C610,220 580,255 565,276" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels (each on a small backing rect for legibility over lines) -->
  <g font-size="12.5" fill="#374151">
    <rect x="450" y="60" width="66" height="18" fill="#ffffff"/>
    <text x="483" y="73" text-anchor="middle">loads rules</text>

    <rect x="800" y="112" width="66" height="18" fill="#ffffff"/>
    <text x="833" y="125" text-anchor="middle">tool call</text>

    <rect x="880" y="46" width="52" height="18" fill="#ffffff"/>
    <text x="906" y="59" text-anchor="middle">result</text>

    <rect x="435" y="112" width="112" height="18" fill="#ffffff"/>
    <text x="491" y="125" text-anchor="middle">more turns / retry</text>

    <rect x="300" y="222" width="180" height="18" fill="#ffffff"/>
    <text x="390" y="235" text-anchor="middle">text reply (+ script if built)</text>

    <rect x="565" y="222" width="104" height="18" fill="#ffffff"/>
    <text x="617" y="235" text-anchor="middle">turns exhausted</text>
  </g>

  <!-- ===== Nodes ===== -->

  <!-- User message -->
  <ellipse cx="100" cy="70" rx="86" ry="34" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="100" y="75" text-anchor="middle" font-size="13.5" fill="#1f2937">User message</text>

  <!-- Knowledge -->
  <rect x="250" y="38" width="190" height="64" rx="10" fill="#eef4ff" stroke="#3b5fd9" stroke-width="1.8"/>
  <text x="345" y="58" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Knowledge</text>
  <text x="345" y="76" text-anchor="middle" font-size="11.5" fill="#1e3a8a">loads skills/&lt;resource&gt;/SKILL.md</text>
  <text x="345" y="91" text-anchor="middle" font-size="11.5" fill="#1e3a8a">into the system prompt</text>

  <!-- Orchestration outer group -->
  <rect x="500" y="16" width="330" height="200" rx="12" fill="none" stroke="#7c5cff" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="515" y="10" font-size="12.5" font-weight="700" fill="#5b3fd6" transform="translate(0,20)">Orchestration (LangGraph)</text>

  <rect x="523" y="55" width="274" height="55" rx="8" fill="#ffffff" stroke="#7c5cff" stroke-width="1.8"/>
  <text x="660" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#4c2fb0">call_model</text>
  <text x="660" y="93" text-anchor="middle" font-size="11" fill="#4c2fb0">LLM decides a tool call, or replies</text>

  <rect x="523" y="130" width="274" height="55" rx="8" fill="#ffffff" stroke="#7c5cff" stroke-width="1.8"/>
  <text x="660" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#4c2fb0">execute_tools</text>
  <text x="660" y="168" text-anchor="middle" font-size="11" fill="#4c2fb0">routes to the next step</text>

  <!-- Tool layer -->
  <rect x="888" y="70" width="232" height="80" rx="10" fill="#e6f7f5" stroke="#0f8a82" stroke-width="1.8"/>
  <text x="1004" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b5c56">Tool layer (MCP)</text>
  <text x="1004" y="110" text-anchor="middle" font-size="11" fill="#0b5c56">build_rke2_cluster_plan --</text>
  <text x="1004" y="126" text-anchor="middle" font-size="11" fill="#0b5c56">validates + renders a script</text>

  <!-- Reply -->
  <ellipse cx="175" cy="320" rx="150" ry="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="175" y="316" text-anchor="middle" font-size="12.5" fill="#1f2937">Reply -- question, or final</text>
  <text x="175" y="333" text-anchor="middle" font-size="12.5" fill="#1f2937">text with the script</text>

  <!-- Fallback -->
  <ellipse cx="560" cy="320" rx="130" ry="44" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="560" y="316" text-anchor="middle" font-size="12.5" fill="#1f2937">Fallback message</text>
  <text x="560" y="333" text-anchor="middle" font-size="12.5" fill="#1f2937">(turns exhausted)</text>

  <!-- No-execution banner, replacing the old approval gate / real infra half -->
  <rect x="140" y="392" width="880" height="56" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="580" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">No execute / deploy / provision tool exists anywhere in this layer</text>
  <text x="580" y="433" text-anchor="middle" font-size="11.5" fill="#991b1b">build_rke2_cluster_plan is read-only -- nothing above can reach real infrastructure, for any target</text>
</svg>
