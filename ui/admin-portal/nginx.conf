server {
    # 8080, not 80: the image is nginx-unprivileged and runs as uid 101,
    # which cannot bind a privileged port. The chart mounts its own copy of
    # this file over /etc/nginx/conf.d/default.conf with the same port from
    # .Values.containerPort, so the two must not drift.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (React Router) owns unmatched paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
