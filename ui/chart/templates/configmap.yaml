{{- $upstream := include "portal.apiUpstream" . }}
{{- $gatewayUpstream := .Values.config.gatewayUpstream }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portal.fullname" . }}
  labels: {{- include "portal.labels" . | nindent 4 }}
data:
  # Mounted over /etc/nginx/conf.d/default.conf, replacing the one baked
  # into the image -- so the API upstream is a deploy-time value and one
  # image serves every namespace.
  default.conf: |
    error_log /var/log/nginx/error.log {{ .Values.config.logLevel }};

    server {
        listen {{ .Values.containerPort }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # For the probes. Serving the SPA at / means a 200 there says
        # only that nginx is up and index.html exists, which is also
        # true of a half-built image; this says nginx is answering.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    {{- if $upstream }}
      {{- range .Values.config.apiPrefixes }}

        # The API, on the portal's own origin: no CORS, no second host
        # to configure in the bundle.
        location {{ . }} {
            # Through a variable deliberately. A literal proxy_pass is
            # resolved once at startup, so a portal installed before its
            # API exists would crash-loop on "host not found in
            # upstream"; a variable is resolved per request.
            resolver {{ $.Values.config.resolver }} valid=10s;
            set $api_upstream {{ $upstream }};
            proxy_pass $api_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The refresh call sends its cookie; nothing else here needs
            # it, and passing it through costs nothing.
            proxy_set_header Cookie $http_cookie;
        }
      {{- end }}
    {{- end }}
    {{- if $gatewayUpstream }}

        # The model gateway, on the portal's own origin too, under a
        # separate prefix and a separate upstream from the API above
        # (chat talks to model-gateway, everything else to the control
        # plane) -- so the prefix is stripped before forwarding, unlike
        # the apiPrefixes loop, which forwards $request_uri unchanged.
        location /mg/ {
            resolver {{ .Values.config.resolver }} valid=10s;
            set $gateway_upstream {{ $gatewayUpstream }};
            rewrite ^/mg/(.*)$ /$1 break;
            proxy_pass $gateway_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Chat streams token-by-token; buffering would hold the
            # whole response until it ends, which is the opposite of
            # what a streaming reply is for.
            proxy_buffering off;
        }
    {{- end }}

        # SPA fallback -- React Router owns every unmatched path. Last,
        # so it cannot shadow the locations above.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
