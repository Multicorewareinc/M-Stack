{{- $sa := .Values.serviceAccount | default dict -}}
{{- if or (not (hasKey $sa "create")) $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "portal.serviceAccountName" . }}
  labels: {{- include "portal.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
No API token is mounted: nothing in this service talks to the Kubernetes
API, so a mounted token is only ever a credential an attacker inherits
after an RCE. Set at both levels -- here, and on the pod spec -- because
the pod-level field is the one that actually governs, and this one keeps
the intent visible on the object itself.
*/}}
automountServiceAccountToken: false
{{- end }}
