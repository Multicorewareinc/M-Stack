# One chart, installed once per portal. The two portals differ only in
# which image they serve and which API they talk to -- same nginx, same
# port, same SPA fallback -- so a second copy of this would be two
# things to keep in step for no gain.
#
#   helm install admin-portal ui/chart --set image.repository=...
#   helm install org-portal   ui/chart --set image.repository=...

replicaCount: 1

image:
  repository: ghcr.io/multicorewareinc/m-stack/organization-portal
  tag: ""                      # defaults to .Chart.AppVersion
  # A sha256 digest, e.g. sha256:abc123... When set it REPLACES the tag,
  # which is the only way to guarantee every node runs the same build --
  # a re-pushed tag plus imagePullPolicy IfNotPresent otherwise leaves
  # already-cached nodes on the old image indefinitely. Pin this for any
  # deploy you would need to reproduce.
  digest: ""
  # Never Always. There is no registry: images are built locally and
  # sideloaded into one node's containerd (scratch/rebuild/images.sh),
  # so a pull attempt can only fail.
  pullPolicy: IfNotPresent

# GHCR packages are private by default, so a pull needs credentials.
# Named by convention rather than passed through every spec: the
# Secret is namespace-scoped and created alongside the release (see
# docs/publishing.md). Set it to [] for a public package or a
# mirror that needs no auth.
imagePullSecrets:
  - name: ghcr-creds
service:
  type: ClusterIP
  port: 80

# Must match the port nginx listens on in the image (EXPOSE 8080). 8080
# rather than 80 because the image is nginx-unprivileged, which runs as
# uid 101 and cannot bind a privileged port. This value is also what the
# templated nginx.conf in configmap.yaml puts in its `listen` directive,
# so the two cannot drift. The Service targets the port by NAME, so
# service.port below stays 80 and callers are unaffected.
containerPort: 8080

# --- non-secret configuration -> ConfigMap -> mounted nginx.conf ------
config:
  # nginx error_log level: debug, info, notice, warn, error.
  logLevel: notice

  # Where /v1 goes. The portals call their API on the same origin under
  # /v1 (src/api/client.ts defaults VITE_API_BASE_URL to "/v1"), so this
  # proxy is what connects them -- and keeping it a deploy-time value
  # rather than a build-time bake means one image serves any namespace.
  #
  #   http://organization-control-plane.<namespace>.svc.cluster.local:8000
  apiUpstream: ""

  # Which prefixes go to the API rather than the SPA. Two, not one:
  # nearly every call is getBaseUrl() + path, which is /v1/..., but the
  # silent token refresh in src/api/client.ts calls '/api/auth/refresh'
  # directly and bypasses the base URL. Proxy only /v1/ and that one
  # request falls through to the SPA fallback, which answers 200 with
  # index.html -- so the refresh does not fail, it succeeds and returns
  # HTML.
  apiPrefixes:
    - /v1/
    - /api/

  # Where /mg goes (chat only -- src/features/chat calls /mg/v1/...).
  # Empty means no /mg location is rendered at all, so a call to it
  # falls through to the SPA fallback and returns 200 with index.html --
  # same silent-HTML failure mode as an unlisted apiPrefix, which is why
  # this exists as its own value rather than folding /mg/ into
  # apiPrefixes (that loop forwards $request_uri unchanged; /mg/ needs
  # the prefix stripped before it reaches the gateway).
  #
  #   http://gateway-model-gateway.<namespace>.svc.cluster.local:8080
  gatewayUpstream: ""

  # Set true only to deploy a portal deliberately without an API: the
  # static bundle loads, every /v1 call returns 404, and the login it
  # opens on cannot complete. Useful for looking at the build. Without
  # this the install refuses, because "deployed and unusable" otherwise
  # looks identical to "deployed and working".
  allowNoApi: false

  # Resolver for the proxy. Needed because the upstream is passed
  # through a variable (see the ConfigMap), which makes nginx resolve it
  # per request instead of at startup -- so a portal can be installed
  # before its API exists rather than crash-looping on
  # "host not found in upstream".
  #
  # An IP, not a Service name: nginx resolves the resolver's own address
  # at startup, and `nginx -t` on a name fails outright with
  # "host not found in resolver". This is the cluster DNS ClusterIP:
  #
  #   kubectl -n kube-system get svc -l k8s-app=kube-dns
  resolver: 10.43.0.10

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

# There is no registry, so the image exists in exactly one node's
# containerd. Without this the pod schedules anywhere and sits in
# ImagePullBackOff -- which is where chart-test/tokenizer has been for
# 20 hours, on mcw-all-series, while its image sits on rke2-wrk-2.
# Remove this the day a registry exists, not before.
nodeSelector: {}

# Nothing else keeps workloads off the control plane: rke2-cp01 carries
# no taint.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

tolerations: []
podAnnotations: {}

# uid 101 is what nginx-unprivileged ships as, and its cache, log and pid
# paths are owned by it -- so this matches the image rather than imposing
# a uid the image has no writable directories for. runAsGroup/fsGroup are
# deliberately left alone for the same reason: the image's own group
# ownership already works, and overriding it would break nginx's cache
# writes for no gain.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The served bundle is baked into the image and never rewritten, so the
  # root filesystem can stay immutable. nginx does need /tmp for its temp
  # paths, which the Deployment mounts as an emptyDir when this is true --
  # without it nginx refuses to start at all.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# A ServiceAccount of this release's own, bound to no Role. None of these
# services call the Kubernetes API, so the token is never mounted (see
# serviceaccount.yaml) -- this exists to stop the pods inheriting whatever
# the namespace's shared "default" SA has been granted.
serviceAccount:
  create: true
  # Empty => <release>-<chart>. Set a name to reuse an existing account.
  name: ""
  annotations: {}

# Off deliberately. This workload runs a single replica on purpose (see
# replicaCount above), and a PDB over one pod cannot both keep it up and
# let a node drain: minAvailable 1 would block the drain indefinitely,
# which is worse than the brief gap a drain already costs here. Enable it
# only alongside a replicaCount above 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Ingress lockdown. Disabled by default => no NetworkPolicy is installed
# and the Service stays reachable from anywhere in-cluster, matching
# today's behavior. Enabling it with an EMPTY allowedIngress denies all
# ingress to this service, so set the callers at the same time.
networkPolicy:
  enabled: false
  # matchLabels selectors allowed to reach containerPort. Its callers are:
  #   (whatever fronts it -- an ingress controller's pods, e.g.
  #   app.kubernetes.io/name: ingress-nginx)
  allowedIngress: []
